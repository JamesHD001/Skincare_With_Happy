<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }} | Skincare With Happy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f7fa; color: #1E3A8A; margin: 0; }
        .container { max-width: 900px; margin: 60px auto; background: #fff; border-radius: 10px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .price { color: #198754; font-size: 1.8rem; font-weight: 700; }
        .button { display: inline-block; background: #FF8C00; color: #fff; padding: 12px 22px; border-radius: 6px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ product.name }}</h1>
        <p class="price">₦{{ '%.2f' % product.price }}</p>
        <p>{{ product.description or 'A soothing skincare essential for healthy-looking skin.' }}</p>
        <form method="post" action="/cart/add">
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <input type="hidden" name="quantity" value="1">
            <button class="button" type="submit">Add to cart</button>
        </form>
    </div>
</body>
</html>
